<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GitHub hand-drawn icon</title>
  <desc id="desc">A loose black ink drawing of the Octocat face inside an imperfect circle.</desc>
  <g fill="none" stroke="#111111" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- An intentionally imperfect ring, matching the casual marker line of the reference. -->
    <path d="M208 126c1 46-32 82-78 84-48 2-83-30-85-77-2-48 31-84 78-86 48-2 84 31 85 79Z"/>

    <!-- Octocat-inspired head: loose geometry, open line work, no mechanical symmetry. -->
    <path d="M79 111c-2-12 0-25 6-36l3-14 22 12c12-4 25-4 37 0l22-13 2 16c6 11 8 23 5 35"/>
    <path d="M176 109c4 9 5 19 2 29-5 22-23 34-50 34-28 0-47-11-52-33-3-10-1-21 3-30"/>
    <path d="M91 83c4-2 8-3 13-5M153 78c5 1 9 3 13 6"/>

    <!-- Face and whiskers. -->
    <path d="M106 119l1 1M151 119l1 1" stroke-width="9"/>
    <path d="M124 136c3 2 6 2 9 0M128 138c0 8-6 11-12 8M129 139c1 7 7 10 13 7"/>
    <path d="M94 134l-23-5M94 144l-22 3M161 134l24-5M161 144l22 4"/>

    <!-- Small shoulder line hints at the familiar GitHub avatar without filling the mark. -->
    <path d="M105 169c-2 9-1 18 1 24M150 169c3 8 3 17 1 24"/>
  </g>
</svg>
